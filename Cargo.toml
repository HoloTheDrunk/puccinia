[package]
name = "puccinia"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi-to-tui = "4.0.1"
anyhow = "1.0.69"
arboard = "3.2.0"
chrono = "0.4.37"
clap = { version = "4.1.4", features = ["derive"] }
crossterm = "0.26.0"
ellipse = "0.2.0"
field_iterator = "0.1.0"
itertools = "0.11.0"
pest = "2.7.9"
pest_derive = "2.7.9"
rand = "0.8.5"
ratatui = "0.26.2"
rune = "0.13.2"
# TODO: Restrict scope of rune-modules to only the necessary features
rune-modules = { version = "0.13.2", features = ["full"] }
shellexpand = "3.1.0"
strum = { version = "0.25.0", features = ["derive", "strum_macros"] }
thiserror = "1.0.38"
walkdir = "2.5.0"
